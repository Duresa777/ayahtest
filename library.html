<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Library - Ayah Looper</title>
    <meta name="author" content="Duresa Haji">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
/* =========================================
   THEME ENGINE (11 THEMES)
   ========================================= */
:root, [data-theme="coffee"] { --bg-color: #1a1614; --surface: #26211e; --primary: #d4af37; --text-main: #f5f0eb; --text-muted: #a69b91; --border-color: rgba(212, 175, 55, 0.2); --danger: #ef4444;}
[data-theme="midnight"] { --bg-color: #0f172a; --surface: #1e293b; --primary: #38bdf8; --text-main: #f1f5f9; --text-muted: #94a3b8; --border-color: rgba(56, 189, 248, 0.2); }
[data-theme="forest"] { --bg-color: #0d1a16; --surface: #132721; --primary: #4ade80; --text-main: #ecfdf5; --text-muted: #6ee7b7; --border-color: rgba(74, 222, 128, 0.2); }
[data-theme="amethyst"] { --bg-color: #2e1065; --surface: #4c1d95; --primary: #c084fc; --text-main: #f3e8ff; --text-muted: #d8b4fe; --border-color: rgba(192, 132, 252, 0.2); }
[data-theme="rose"] { --bg-color: #27272a; --surface: #3f3f46; --primary: #fb7185; --text-main: #ffe4e6; --text-muted: #fda4af; --border-color: rgba(251, 113, 133, 0.2); }
[data-theme="monochrome"] { --bg-color: #000000; --surface: #111111; --primary: #ffffff; --text-main: #ffffff; --text-muted: #888888; --border-color: #333333; }
[data-theme="ocean"] { --bg-color: #083344; --surface: #164e63; --primary: #22d3ee; --text-main: #cffafe; --text-muted: #67e8f9; --border-color: rgba(34, 211, 238, 0.2); }
[data-theme="sunset"] { --bg-color: #450a0a; --surface: #7f1d1d; --primary: #fb923c; --text-main: #ffedd5; --text-muted: #fdba74; --border-color: rgba(251, 146, 60, 0.2); }
[data-theme="dracula"] { --bg-color: #282a36; --surface: #44475a; --primary: #ff79c6; --text-main: #f8f8f2; --text-muted: #6272a4; --border-color: rgba(255, 121, 198, 0.2); }
[data-theme="nord"] { --bg-color: #2e3440; --surface: #3b4252; --primary: #88c0d0; --text-main: #eceff4; --text-muted: #d8dee9; --border-color: rgba(136, 192, 208, 0.2); }
[data-theme="matcha"] { --bg-color: #2d372c; --surface: #3e4a3d; --primary: #a3b18a; --text-main: #dad7cd; --text-muted: #849669; --border-color: rgba(163, 177, 138, 0.2); }

/* =========================================
   NATIVE DESKTOP OVERRIDES
   ========================================= */
body, html {
    margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
    background-color: var(--bg-color);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
}
input, select { -webkit-user-select: text; user-select: text; font-family: inherit; box-sizing: border-box; }
button, a, .sidebar-btn { outline: none !important; -webkit-tap-highlight-color: transparent; cursor: default !important; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 8px; border: 2px solid var(--bg-color); }
::-webkit-scrollbar-thumb:hover { background: rgba(150, 150, 150, 0.6); }

/* =========================================
   SIDEBAR & SKELETON
   ========================================= */
.titlebar-drag-region { position: absolute; top: 0; left: 0; right: 0; height: 32px; -webkit-app-region: drag; z-index: 9999; pointer-events: none; }
.app-wrapper { display: flex; height: 100%; }

.app-sidebar {
    width: 72px; background: var(--surface); border-inline-end: 1px solid var(--border-color);
    display: flex; flex-direction: column; align-items: center; padding: 24px 0; z-index: 50; flex: none;
}
.sidebar-logo { font-size: 2rem; color: var(--primary); margin-bottom: 40px; }
.sidebar-btn {
    background: transparent; border: none; color: var(--text-muted); font-size: 1.5rem;
    width: 48px; height: 48px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: 0.2s; margin-bottom: 8px; text-decoration: none;
}
.sidebar-btn:hover { color: var(--primary); background: rgba(212, 175, 55, 0.1); }
.sidebar-btn.active { color: var(--primary); background: rgba(212, 175, 55, 0.15); border: 1px solid var(--border-color); }

.main-content {
    flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center;
}

/* =========================================
   LIBRARY HEADER & FILTERS
   ========================================= */
.library-container { width: 100%; max-width: 1200px; }
.library-header { text-align: center; margin-bottom: 2rem; }
.library-header h1 { font-size: 2.5rem; margin: 0 0 0.5rem 0; letter-spacing: -0.5px; color: var(--text-main); font-weight: 700; }
.library-header p { color: var(--text-muted); margin: 0 0 2rem 0; font-weight: 500; }

.filters { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
.filter-input, .reciter-dropdown {
    background: var(--surface); border: 2px solid var(--border-color); color: var(--text-main);
    padding: 14px 20px; border-radius: 16px; font-size: 1rem; font-weight: 500; outline: none; transition: all 0.3s ease;
}
.filter-input { min-width: 250px; flex: 1; max-width: 400px; }
.reciter-dropdown { cursor: pointer; }
.filter-input:focus, .reciter-dropdown:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }

/* =========================================
   BEAUTIFUL SURAH CARDS (DYNAMIC THEME)
   ========================================= */
.surah-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;
}

.surah-card {
    background: var(--surface); border: 2px solid var(--border-color); border-radius: 20px;
    padding: 1.5rem; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer !important; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}
.surah-card:hover {
    border-color: var(--primary); transform: translateY(-5px); background: var(--bg-color); box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

.surah-info { display: flex; align-items: center; gap: 1rem; pointer-events: none; }
.surah-number {
    background: var(--bg-color); color: var(--primary); font-weight: 700;
    width: 44px; height: 44px; display: flex; justify-content: center; align-items: center;
    border-radius: 12px; font-size: 1rem; border: 1px solid var(--border-color); transition: all 0.3s ease;
    flex-shrink: 0;
}
.surah-card:hover .surah-number { background: var(--primary); color: #fff; border-color: var(--primary); }

.surah-names h3 { margin: 0; font-size: 1.15rem; font-weight: 600; color: var(--text-main); }
.surah-names p { margin: 0; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

.play-icon { color: var(--primary); font-size: 2rem; opacity: 0.3; transition: all 0.3s ease; pointer-events: none; flex-shrink: 0; }
.surah-card:hover .play-icon { opacity: 1; transform: scale(1.1); }

/* =========================================
   MOBILE NATIVE APP LAYOUT (LIBRARY)
   ========================================= */
@media (max-width: 768px) {
    /* 1. Fix the Scrolling Bug completely */
    html, body {
        height: auto !important;
        min-height: 100vh;
        overflow-y: auto !important;
        overflow-x: hidden !important;
    }
    
    .app-wrapper {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
    }

    /* Convert Sidebar into a Mobile Top Nav */
    .app-sidebar {
        width: 100%;
        padding: 10px 15px;
        flex-direction: row;
        justify-content: space-between;
        border-inline-end: none;
        border-bottom: 1px solid var(--border-color);
        box-sizing: border-box;
        position: sticky; /* Keeps the nav bar pinned to the top of the screen */
        top: 0;
        z-index: 100;
        background: var(--surface);
    }
    .app-sidebar > div {
        flex-direction: row !important;
        gap: 15px;
    }
    .sidebar-logo { display: none; }
    .sidebar-btn { margin-bottom: 0; width: 44px; height: 44px; font-size: 1.4rem; }

    /* Adjust Main Layout */
    .main-content {
        padding: 20px 15px;
        overflow-y: visible;
    }

    .library-header h1 { font-size: 1.8rem; }
    .library-header p { font-size: 0.9rem; margin-bottom: 1.5rem; }

    /* Stack Filters for Thumb Tapping */
    .filters {
        flex-direction: column;
        width: 100%;
        gap: 12px;
    }
    .filter-input, .reciter-dropdown {
        width: 100%;
        max-width: 100%;
    }

    /* Transform Grid into a Native List View */
    .surah-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }
    .surah-card {
        padding: 16px;
        border-radius: 16px;
    }
    .surah-card:hover {
        transform: none; /* Disable the upward floating hover effect on mobile */
    }
}
    </style>
</head>
<body>
    <!-- Instantly apply the saved theme before the page renders -->
    <script>
        const savedTheme = localStorage.getItem('ayah_theme') || 'coffee';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <div class="titlebar-drag-region"></div>

    <div class="app-wrapper">
        <!-- SIDEBAR / TOP NAV -->
        <aside class="app-sidebar">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <i class="ph-fill ph-infinity sidebar-logo"></i>
                
                <!-- Navigate to Player -->
                <a href="index.html" class="sidebar-btn" title="Home / Player">
                    <i class="ph ph-house"></i>
                </a>
                
                <!-- Active Library Tab -->
                <button class="sidebar-btn active" title="Library">
                    <i class="ph-fill ph-books"></i>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="library-container">
                
                <div class="library-header">
                    <h1>Quran Audio Library</h1>
                    <p>Select a reciter and Surah to instantly load it into Ayah Looper.</p>
                </div>

                <div class="filters">
                    <select id="reciterSelect" class="reciter-dropdown">
                        <option value="mishaari_raashid_al_3afaasee">Mishary Rashid Alafasy</option>
                        <option value="muhammad_siddeeq_al-minshaawee">Mohamed Siddiq al-Minshawi</option>
                        <option value="mahmood_khaleel_al-husaree">Mahmoud Khalil Al-Husary</option>
                    </select>
                    
                    <input type="text" class="filter-input" id="searchInput" placeholder="Search for a Surah...">
                </div>

                <div class="surah-grid" id="surahGrid">
                    <!-- Javascript injects cards here -->
                </div>

            </div>
        </main>
    </div>

    <!-- LIBRARY LOGIC -->
    <script>
        const surahGrid = document.getElementById('surahGrid');
        const searchInput = document.getElementById('searchInput');
        const reciterSelect = document.getElementById('reciterSelect');

        async function loadSurahs() {
            try {
                surahGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); font-weight: 500;">Loading library...</p>';
                
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                const surahs = data.data;

                surahGrid.innerHTML = '';

                surahs.forEach(surah => {
                    const card = document.createElement('div');
                    card.className = 'surah-card';
                    card.innerHTML = `
                        <div class="surah-info">
                            <div class="surah-number">${surah.number}</div>
                            <div class="surah-names">
                                <h3>${surah.englishName}</h3>
                                <p>${surah.englishNameTranslation}</p>
                            </div>
                        </div>
                        <i class="ph-fill ph-play-circle play-icon"></i>
                    `;

                    card.addEventListener('click', () => {
                        const reciterValue = reciterSelect.value;
                        const reciterName = reciterSelect.options[reciterSelect.selectedIndex].text;
                        const paddedNumber = String(surah.number).padStart(3, '0');
                        const audioUrl = `https://download.quranicaudio.com/quran/${reciterValue}/${paddedNumber}.mp3`;
                        
                        window.location.href = `index.html?audio=${encodeURIComponent(audioUrl)}&title=${encodeURIComponent(surah.englishName)}&reciter=${encodeURIComponent(reciterName)}`;
                    });

                    surahGrid.appendChild(card);
                });

                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const cards = document.querySelectorAll('.surah-card');
                    
                    cards.forEach((c, index) => {
                        const name = surahs[index].englishName.toLowerCase();
                        const translation = surahs[index].englishNameTranslation.toLowerCase();
                        
                        if (name.includes(term) || translation.includes(term)) {
                            c.style.display = 'flex';
                        } else {
                            c.style.display = 'none';
                        }
                    });
                });

            } catch (error) {
                console.error("Error loading Surahs:", error);
                surahGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--danger);">Error loading library. Please check your internet connection.</p>';
            }
        }

        loadSurahs();
    </script>
</body>
</html>
